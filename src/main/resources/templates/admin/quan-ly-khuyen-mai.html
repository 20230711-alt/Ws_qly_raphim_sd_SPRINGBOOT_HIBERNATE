<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineBook - Quản lý Khuyến Mãi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="~{admin :: admin-css}"></style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('khuyen-mai')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Quản lý Khuyến mãi')}"></div>

        <div class="content-section active">
            <div class="panel">
                <div class="panel-header">
                    <h4>Mã Giảm Giá & Chương Trình Khuyến Mãi</h4>
                    <button class="btn-action" onclick="openModal('Tạo Mã Khuyến Mãi')"><i class="fa-solid fa-plus"></i> Tạo mã mới</button>
                </div>
                <table>
                    <thead>
                        <tr><th>Mã Voucher</th><th>Tên Chương Trình</th><th>Mức Giảm</th><th>Hạn Dùng</th><th>Trạng Thái</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><b>SUMMER50</b></td><td>Ưu đãi chào hè rực rỡ</td><td>Giảm 50.000đ đơn từ 150k</td><td>31/05/2026</td><td><span class="badge success">Hoạt động</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/modal :: commonModal}"></div>

    <script>
        function openModal(title) { document.getElementById('modalTitle').innerText = title; document.getElementById('commonModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('commonModal').style.display = 'none'; }
    </script>
</body>
</html>
