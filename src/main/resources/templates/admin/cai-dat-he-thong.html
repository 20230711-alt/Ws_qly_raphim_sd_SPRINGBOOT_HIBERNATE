<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineBook - Cài Đặt Hệ Thống</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="~{admin :: admin-css}"></style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('cai-dat')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Cài đặt hệ thống')}"></div>

        <div class="content-section active">
            <div class="panel">
                <div class="panel-header"><h4>Cấu Hình Thông Số Hệ Thống</h4></div>
                <div style="display: flex; flex-direction: column; gap: 14px; max-width: 400px; margin-top: 10px;">
                    <div class="form-group"><label>Tên hệ thống rạp</label><input type="text" value="CineBook Cinema Management"></div>
                    <div class="form-group"><label>Email nhận báo cáo tự động</label><input type="email" value="admin@cinebook.vn"></div>
                    <button class="btn-action" style="width: fit-content;" onclick="alert('Lưu cấu hình thành công!')">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
