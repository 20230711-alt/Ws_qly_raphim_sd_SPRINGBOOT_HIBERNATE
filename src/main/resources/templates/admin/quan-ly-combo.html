<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Quản lý Combo Bắp Nước</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="~{admin :: admin-css}"></style>
    <style>
        .combo-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: rgba(34, 197, 94, 0.15); color: #22C55E; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-inactive { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        /* Modal Style */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content-box {
            background: #181E2A;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .form-group-custom {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group-custom label { font-size: 13px; color: #8E96A7; font-weight: 600; }
        .form-group-custom input, .form-group-custom select, .form-group-custom textarea {
            background: #10141E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFF;
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('combo')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Quản lý Combo Bắp Nước')}"></div>

        <div class="content-section active">
            <div class="panel">
                <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h4>Quản lý Bắp Nước & Combo</h4>
                    <button type="button" class="btn-filter" style="background: #FF2A5F; cursor: pointer;" onclick="openComboModal()">
                        <i class="fa-solid fa-plus"></i> Thêm combo
                    </button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Hình ảnh</th>
                            <th>Mã Combo</th>
                            <th>Tên Combo</th>
                            <th>Mô Tả Thành Phần</th>
                            <th>Giá Bán</th>
                            <th>Trạng Thái</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- HIỂN THỊ DỮ LIỆU ĐỘNG TỪ SPRING BOOT -->
                        <tr th:each="cb : ${combos}">
                            <td>
                                <img th:src="${cb.imageUrl != null ? cb.imageUrl : 'https://via.placeholder.com/50'}" 
                                     alt="Combo" class="combo-img"
                                     onerror="this.src='https://images.unsplash.com/photo-1578849278619-e73505e9610f?w=100'">
                            </td>
                            <td th:text="${cb.code}" style="font-weight: bold; color: #FF2A5F;">CB_BIG</td>
                            <td th:text="${cb.name}" style="font-weight: 600;">Combo Siêu To</td>
                            <td th:text="${cb.description}">1 Bắp lớn + 2 Nước ngọt Coca lớn</td>
                            <td th:text="${#numbers.formatDecimal(cb.price, 0, 'COMMA', 0, 'POINT') + ' đ'}" style="color: #22C55E; font-weight: 600;">89.000 đ</td>
                            <td>
                                <span th:if="${cb.status == 'Đang kinh doanh' || cb.status == null}" class="status-badge status-active">Đang kinh doanh</span>
                                <span th:if="${cb.status == 'Tạm ngưng'}" class="status-badge status-inactive">Tạm ngưng</span>
                            </td>
                            <td>
                                <button type="button" class="btn-sm btn-edit" th:onclick="editCombo([[${cb.id}]], [[${cb.code}]], [[${cb.name}]], [[${cb.description}]], [[${cb.price}]], [[${cb.imageUrl}]], [[${cb.status}]])">Sửa</button>
                                <a th:href="@{/admin/combo/delete/{id}(id=${cb.id})}" class="btn-sm btn-delete" style="background: #EF4444; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none;" onclick="return confirm('Bạn có chắc muốn xóa combo này?')">Xóa</a>
                            </td>
                        </tr>
                        <tr th:if="${combos == null || combos.isEmpty()}">
                            <td colspan="7" style="text-align: center; color: #8E96A7; padding: 20px;">Chưa có dữ liệu Combo Bắp Nước.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP THÊM / SỬA COMBO -->
    <div id="comboModalOverlay" class="modal-overlay">
        <div class="modal-content-box">
            <h3 id="modalTitle" style="color: #FFF; margin-top: 0; margin-bottom: 16px;">Thêm Combo Mới</h3>
            
            <form th:action="@{/admin/combo/save}" method="post">
                <input type="hidden" id="comboId" name="id">

                <div class="form-group-custom">
                    <label>Mã Combo:</label>
                    <input type="text" id="comboCode" name="code" required placeholder="VD: CB_BIG">
                </div>

                <div class="form-group-custom">
                    <label>Tên Combo:</label>
                    <input type="text" id="comboName" name="name" required placeholder="VD: Combo Siêu To">
                </div>

                <div class="form-group-custom">
                    <label>Mô tả thành phần:</label>
                    <textarea id="comboDescription" name="description" rows="2" placeholder="VD: 1 Bắp lớn + 2 Nước ngọt"></textarea>
                </div>

                <div class="form-group-custom">
                    <label>Giá bán (VNĐ):</label>
                    <input type="number" id="comboPrice" name="price" required placeholder="89000">
                </div>

                <div class="form-group-custom">
                    <label>Link Ảnh Minh Họa (Image URL):</label>
                    <input type="text" id="comboImageUrl" name="imageUrl" placeholder="https://image-link.jpg">
                </div>

                <div class="form-group-custom">
                    <label>Trạng Thái:</label>
                    <select id="comboStatus" name="status">
                        <option value="Đang kinh doanh">Đang kinh doanh</option>
                        <option value="Tạm ngưng">Tạm ngưng</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-reset" onclick="closeComboModal()" style="cursor: pointer;">Hủy bỏ</button>
                    <button type="submit" class="btn-filter" style="background: #FF2A5F; cursor: pointer;">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openComboModal() {
            document.getElementById('modalTitle').innerText = "Thêm Combo Mới";
            document.getElementById('comboId').value = "";
            document.getElementById('comboCode').value = "";
            document.getElementById('comboName').value = "";
            document.getElementById('comboDescription').value = "";
            document.getElementById('comboPrice').value = "";
            document.getElementById('comboImageUrl').value = "";
            document.getElementById('comboStatus').value = "Đang kinh doanh";
            document.getElementById('comboModalOverlay').classList.add('show');
        }

        function editCombo(id, code, name, description, price, imageUrl, status) {
            document.getElementById('modalTitle').innerText = "Chỉnh Sửa Combo";
            document.getElementById('comboId').value = id;
            document.getElementById('comboCode').value = code;
            document.getElementById('comboName').value = name;
            document.getElementById('comboDescription').value = description;
            document.getElementById('comboPrice').value = price;
            document.getElementById('comboImageUrl').value = imageUrl;
            document.getElementById('comboStatus').value = status || "Đang kinh doanh";
            document.getElementById('comboModalOverlay').classList.add('show');
        }

        function closeComboModal() {
            document.getElementById('comboModalOverlay').classList.remove('show');
        }
    </script>
</body>
</html>
