<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - CINEBOOK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --pink-accent: #FF2A5F;
            --card-bg: rgba(10, 12, 18, 0.65);
            --border-color: rgba(255, 255, 255, 0.18);
            --text-gray: #B0B7C6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background: linear-gradient(to bottom, rgba(5, 7, 12, 0.25), rgba(5, 7, 12, 0.55)),
                        url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1600') center/cover no-repeat fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 60px;
            background: rgba(7, 9, 14, 0.5);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo i, .logo span { color: var(--pink-accent); }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(255, 42, 95, 0.2);
        }

        .auth-card h2 { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .auth-card p.subtitle { color: var(--text-gray); font-size: 13px; text-align: center; margin-bottom: 25px; }

        .alert-error {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid #E50914;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #E2E8F0; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 14px; color: var(--pink-accent); font-size: 15px; }
        
        .input-box input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: var(--pink-accent);
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 12px rgba(255, 42, 95, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #FF2A5F 0%, #E50914 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(255, 42, 95, 0.5);
            transition: all 0.2s ease;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 42, 95, 0.7); }

        .auth-footer { margin-top: 25px; text-align: center; font-size: 13px; color: var(--text-gray); }
        .auth-footer a { color: var(--pink-accent); text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <a th:href="@{/}" href="/" class="logo"><i class="fa-solid fa-film"></i> CDD<span>BOOK</span></a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Tạo Tài Khoản</h2>
            <p class="subtitle">Đăng ký để trải nghiệm đặt vé xem phim nhanh chóng</p>

            <!-- Thông báo lỗi nếu trùng email/SĐT -->
            <div th:if="${param.error}" class="alert-error">
                Email hoặc Số điện thoại này đã được đăng ký!
            </div>

            <form th:action="@{/register}" action="/register" method="post">
                <div class="form-group">
                    <label>HỌ VÀ TÊN</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="fullName" placeholder="Nhập họ và tên đầy đủ" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>EMAIL</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" placeholder="Nhập địa chỉ email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>SỐ ĐIỆN THOẠI</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="phone" placeholder="Nhập số điện thoại" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>MẬT KHẨU</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Tạo Tài Khoản</button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a th:href="@{/dang-nhap}" href="/login">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

</body>
</html>
