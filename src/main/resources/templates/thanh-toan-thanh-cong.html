<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Thành Công - CINEBOOK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090E;
            --card-bg: #10141E;
            --pink-accent: #FF2A5F;
            --success-color: #00E676;
            --text-light: #FFFFFF;
            --text-gray: #8E96A7;
            --border-color: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .success-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 20px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .success-icon { width: 80px; height: 80px; background: rgba(0, 230, 118, 0.1); color: var(--success-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px auto; box-shadow: 0 0 20px rgba(0, 230, 118, 0.2); }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: var(--text-light); }
        p { color: var(--text-gray); font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .seat-badge-container { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
        .seat-badge { background: rgba(255, 42, 95, 0.15); color: var(--pink-accent); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; border: 1px solid rgba(255, 42, 95, 0.3); }

        .btn-home { background-color: var(--pink-accent); color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; display: inline-block; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4); width: 100%; }
        .btn-home:hover { background-color: #ff4d79; transform: translateY(-2px); }
        .countdown { margin-top: 15px; font-size: 12px; color: var(--text-gray); }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h2>Thanh Toán Thành Công!</h2>
        <p>Cảm ơn bạn đã đặt vé tại CINEBOOK. Ghế của bạn đã được ghi nhận vào lịch sử giao dịch.</p>
        
        <div class="seat-badge-container" id="seat-list">
            <span class="seat-badge" th:each="seat : ${bookedSeats}" th:text="${seat}"></span>
        </div>

        <a th:href="@{/}" class="btn-home">Về Trang Chủ Ngay</a>
        <div class="countdown">Tự động chuyển về trang chủ sau <span id="timer">5</span> giây...</div>
    </div>

    <script>
        // Lấy thông tin phim và ghế từ URL
        const urlParams = new URLSearchParams(window.location.search);
        let seatsParam = urlParams.get('seats');
        let movieId = urlParams.get('movie') || 'default-movie';
        let storageKey = `cinebook_booked_${movieId}`;

        if (!seatsParam) {
            const badges = document.querySelectorAll('.seat-badge');
            let seatArr = Array.from(badges).map(b => b.innerText.trim()).filter(b => b !== "");
            if (seatArr.length > 0) seatsParam = seatArr.join(',');
        }

        if (seatsParam) {
            let newlyBooked = seatsParam.split(',');
            // Lưu vào khoá riêng của phim đó
            let existingBooked = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            let updatedBooked = Array.from(new Set([...existingBooked, ...newlyBooked]));
            localStorage.setItem(storageKey, JSON.stringify(updatedBooked));
            
            const container = document.getElementById('seat-list');
            if (container && container.children.length === 0) {
                newlyBooked.forEach(s => {
                    let span = document.createElement('span');
                    span.className = 'seat-badge';
                    span.innerText = s;
                    container.appendChild(span);
                });
            }
        }

        // Đếm ngược 5 giây tự động về trang chủ
        let timeLeft = 5;
        const timerSpan = document.getElementById('timer');
        
        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerSpan.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = '/'; 
            }
        }, 1000);
    </script>
</body>
</html>
