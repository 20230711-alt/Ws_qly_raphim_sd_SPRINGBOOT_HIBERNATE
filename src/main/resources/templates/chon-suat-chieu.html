<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEBOOK - Lịch Chiếu & Chọn Rạp</title>

    <!-- Font Awesome Icons 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #07090E;
            --card-bg: #10141E;
            --panel-bg: #161C2B;
            --pink-accent: #FF2A5F;
            --pink-hover: #FF4D79;
            --text-light: #FFFFFF;
            --text-gray: #8E96A7;
            --border-color: rgba(255, 255, 255, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* HEADER CHUẨN MẪU */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 60px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-light);
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 8px;
        }

        .logo i, .logo span {
            color: var(--pink-accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        nav a i { font-size: 15px; }
        nav a:hover, nav a.nav-item.active { color: var(--text-light); }
        nav a.nav-item.active i { color: var(--pink-accent); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .search-icon, .notification-icon {
            color: var(--text-light);
            font-size: 15px;
            cursor: pointer;
            position: relative;
        }

        .notification-icon .badge {
            position: absolute;
            top: -5px;
            right: -6px;
            background: var(--pink-accent);
            color: white;
            font-size: 9px;
            font-weight: bold;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-greeting {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
        }

        .btn-logout-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 42, 95, 0.08);
            border: 1px solid var(--pink-accent);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-logout-header i {
            color: var(--pink-accent);
            font-size: 11px;
        }

        .btn-logout-header:hover {
            background: var(--pink-accent);
            color: white;
        }

        .btn-logout-header:hover i {
            color: white;
        }

        /* CONTAINER CHÍNH */
        .main-container {
            max-width: 1300px;
            margin: 35px auto;
            padding: 0 30px;
        }

        /* BOX KHUNG CHÍNH */
        .showtime-card-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header-title i {
            color: var(--pink-accent);
            font-size: 20px;
        }

        /* THANH CHỌN NGÀY NẰM NGANG */
        .date-tabs-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .date-tab-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 22px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 95px;
            user-select: none;
        }

        .date-tab-item .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .date-tab-item .day-number {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-light);
        }

        .date-tab-item:hover {
            border-color: rgba(255, 42, 95, 0.4);
        }

        .date-tab-item.active {
            background: var(--pink-accent);
            border-color: var(--pink-accent);
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.35);
        }

        .date-tab-item.active .day-name,
        .date-tab-item.active .day-number {
            color: #FFFFFF;
        }

        /* DANH SÁCH RẠP CHIẾU */
        .cinema-list-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cinema-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cinema-title-wrap {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .cinema-title-wrap i {
            color: var(--pink-accent);
            font-size: 16px;
            margin-top: 2px;
        }

        .cinema-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 3px;
        }

        .cinema-address {
            font-size: 12px;
            color: var(--text-gray);
        }

        /* NÚT GIỜ CHIẾU KÈM BADGE IMPAX/2D/3D */
        .time-buttons-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .time-btn-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 18px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .time-btn-item .format-tag {
            font-size: 10px;
            font-weight: 800;
            color: #FACC15;
            text-transform: uppercase;
        }

        .time-btn-item:hover {
            background: var(--pink-accent);
            border-color: var(--pink-accent);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.3);
        }

        .time-btn-item:hover .format-tag {
            color: #FFFFFF;
        }

        .no-showtime-msg {
            padding: 20px;
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header>
        <a th:href="@{/}" class="logo"><i class="fa-solid fa-film"></i> CDD<span>BOOK</span></a>
        
        <nav>
            <ul>
                <li><a th:href="@{/}" class="nav-item"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                <li><a th:href="@{/khuyen-mai}" class="nav-item"><i class="fa-solid fa-gift"></i> Khuyến mãi</a></li>
                <li><a th:href="@{/phim}" class="nav-item active"><i class="fa-solid fa-clapperboard"></i> Phim</a></li>
                <li class="auth-only"><a th:href="@{/thanh-vien}" class="nav-item"><i class="fa-solid fa-id-card"></i><span>Thành viên</span></a></li>
            </ul>
        </nav>

        <div class="header-right">
            <i class="fa-solid fa-magnifying-glass search-icon" title="Tìm kiếm"></i>
            <div class="notification-icon" title="Thông báo">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">3</span>
            </div>
            <span class="user-greeting" th:text="'Xin chào, ' + (${user != null ? user.fullName : 'Linh Xinh Gái'})">Xin chào, Linh Xinh Gái</span>
            <a th:href="@{/dang-nhap}" class="btn-logout-header" onclick="return confirm('Bạn có chắc chắn muốn đăng xuất không?');">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="main-container">

        <div class="showtime-card-wrapper">
            <!-- TIÊU ĐỀ TRANG -->
            <div class="card-header-title">
                <i class="fa-solid fa-calendar-days"></i>
                <span id="pageTitle">Lịch Chiếu & Chọn Rạp</span>
            </div>

            <!-- 1. CHỌN NGÀY CHIẾU (TỰ ĐỘNG TẠO 7 NGÀY KỂ TỪ HÔM NAY) -->
            <div class="date-tabs-container" id="dateTabsList">
                <!-- Javascript sẽ tự động đổ các ô ngày vào đây -->
            </div>

            <!-- 2. DANH SÁCH RẠP & SUẤT CHIẾU RENDER ĐỘNG TỪ DATABASE -->
            <div class="cinema-list-group" id="cinemaListGroup">
                <div class="no-showtime-msg">Đang tải lịch chiếu từ hệ thống...</div>
            </div>
        </div>

    </div>

    <!-- SCRIPT ĐIỀU HƯỚNG VÀ FETCH SUẤT CHIẾU THẬT TỪ API -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('movieId') || 'P01';
        const movieTitleParam = urlParams.get('movieTitle') || '';
        let currentSelectedDateStr = '';
        let globalShowtimesList = []; // Biến chứa toàn bộ suất chiếu lấy từ Database

        // 1. Hàm khởi tạo bộ chọn 7 ngày chiếu
        function initDateTabs() {
            const container = document.getElementById('dateTabsList');
            container.innerHTML = '';
            
            const today = new Date();
            const dayNames = ['CHỦ NHẬT', 'THỨ HAI', 'THỨ BA', 'THỨ TƯ', 'THỨ NĂM', 'THỨ SÁU', 'THỨ BẢY'];

            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(today);
                dateObj.setDate(today.getDate() + i);

                const dayName = (i === 0) ? 'HÔM NAY' : dayNames[dateObj.getDay()];
                const dayNum = String(dateObj.getDate()).padStart(2, '0');
                const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
                const formattedDate = `${dayNum}/${monthNum}`;
                const fullDateValue = `${dateObj.getFullYear()}-${monthNum}-${dayNum}`;

                const item = document.createElement('div');
                item.className = `date-tab-item ${i === 0 ? 'active' : ''}`;
                item.setAttribute('data-date', fullDateValue);
                item.innerHTML = `
                    <div class="day-name">${dayName}</div>
                    <div class="day-number">${formattedDate}</div>
                `;

                if (i === 0) currentSelectedDateStr = fullDateValue;

                item.onclick = function() {
                    document.querySelectorAll('.date-tab-item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    currentSelectedDateStr = this.getAttribute('data-date');
                    renderShowtimesBySelectedDate(); // Render lại giờ chiếu khi chọn ngày mới
                };

                container.appendChild(item);
            }
        }

		// 2. Fetch toàn bộ suất chiếu từ API Backend
		function fetchShowtimesFromApi() {
		    fetch('/api/showtimes')
		        .then(res => {
		            if (!res.ok) {
		                throw new Error("HTTP error " + res.status);
		            }
		            return res.json();
		        })
		        .then(data => {
		            globalShowtimesList = data || [];
		            renderShowtimesBySelectedDate();
		        })
		        .catch(err => {
		            console.error("Lỗi tải suất chiếu:", err);
		            // Nếu API lỗi, tạo dữ liệu dự phòng từ Database tạm để không bị trắng màn hình
		            globalShowtimesList = [
		                { id: 1, cinemaName: "CINEBOOK Vincom Center Đồng Khởi", movieTitle: "Furiosa: A Mad Max Saga", room: "IMAX", showDate: "2026-09-18", showTime: "10:30" },
		                { id: 2, cinemaName: "CINEBOOK Bà Triệu", movieTitle: "Godzilla x Kong: Đế Chế Mới", room: "Phòng 2", showDate: "2026-09-18", showTime: "13:30" },
		                { id: 3, cinemaName: "CINEBOOK Landmark 81", movieTitle: "Dune: Phần hai", room: "Phòng VIP", showDate: "2026-09-19", showTime: "19:45" },
		                { id: 4, cinemaName: "CINEBOOK Landmark 81", movieTitle: "Furiosa: A Mad Max Saga", room: "IMAX", showDate: "2026-09-20", showTime: "09:30" }
		            ];
		            renderShowtimesBySelectedDate();
		        });
		}

        // 3. Render suất chiếu động theo Ngày được chọn
        function renderShowtimesBySelectedDate() {
            const container = document.getElementById('cinemaListGroup');
            container.innerHTML = '';

            // Lọc các suất chiếu khớp với ngày đang chọn
            const filtered = globalShowtimesList.filter(st => {
                return !st.showDate || st.showDate === currentSelectedDateStr;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-showtime-msg">Không có suất chiếu nào cho ngày ${currentSelectedDateStr}. Vui lòng chọn ngày khác!</div>
                `;
                return;
            }

            // Nhóm suất chiếu theo từng Rạp
            const groupedByCinema = {};
            filtered.forEach(st => {
                const cinema = st.cinemaName || 'CINEBOOK Vincom Center Đồng Khởi';
                if (!groupedByCinema[cinema]) {
                    groupedByCinema[cinema] = [];
                }
                groupedByCinema[cinema].push(st);
            });

            // Vẽ giao diện các Rạp và các Nút Giờ Chiếu động
            Object.keys(groupedByCinema).forEach(cinemaName => {
                const showtimeArr = groupedByCinema[cinemaName];

                const cinemaBox = document.createElement('div');
                cinemaBox.className = 'cinema-box';

                let buttonsHtml = '';
                showtimeArr.forEach(st => {
                    const roomTag = st.room || 'IMAX';
                    const timeVal = st.showTime || '09:30';
                    const movieNameVal = st.movieTitle || 'Phim Chiếu Rạp';

                    buttonsHtml += `
                        <a href="#" onclick="selectShowtime('${st.id}', '${cinemaName}', '${timeVal}', '${roomTag}', '${movieNameVal}'); return false;" class="time-btn-item">
                            ${timeVal} <span class="format-tag">${roomTag}</span>
                        </a>
                    `;
                });

                cinemaBox.innerHTML = `
                    <div class="cinema-title-wrap">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <div class="cinema-name">${cinemaName}</div>
                            <div class="cinema-address">Hệ thống CINEBOOK chính hãng</div>
                        </div>
                    </div>
                    <div class="time-buttons-flex">
                        ${buttonsHtml}
                    </div>
                `;

                container.appendChild(cinemaBox);
            });
        }

        // 4. Hàm chuyển sang màn hình Chọn Ghế truyền đầy đủ tham số động
        function selectShowtime(showtimeId, cinemaName, timeSlot, formatType, movieTitle) {
            const redirectUrl = `/chon-ghe?showtimeId=${encodeURIComponent(showtimeId)}&movieId=${encodeURIComponent(movieId)}&movieTitle=${encodeURIComponent(movieTitle)}&cinema=${encodeURIComponent(cinemaName)}&time=${encodeURIComponent(timeSlot)}&date=${encodeURIComponent(currentSelectedDateStr)}&format=${encodeURIComponent(formatType)}`;
            window.location.href = redirectUrl;
        }

        document.addEventListener('DOMContentLoaded', function() {
            initDateTabs();
            fetchShowtimesFromApi();
        });
    </script>
</body>
</html>
